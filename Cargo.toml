[package]
name = "brainjepa"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Brain-JEPA fMRI Foundation Model — inference in Rust (RLX and/or Burn)"
keywords      = ["fmri", "foundation-model", "neuroscience", "brain", "vision-transformer"]
categories    = ["science", "mathematics", "algorithms"]
authors       = ["Eugene Hauptmann"]
license       = "MIT"
homepage      = "https://github.com/eugenehp/brainjepa-rs"
repository    = "https://github.com/eugenehp/brainjepa-rs"
documentation = "https://docs.rs/brainjepa"
readme        = "README.md"

exclude = [
    "data/*",
    "figures/*",
    "hf_model_card/*",
]

autoexamples = false
autotests    = false

[lib]
name = "brainjepa"
path = "src/lib.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"
required-features = ["rlx-engine"]

[[bin]]
name = "infer-burn"
path = "src/bin/infer_burn.rs"
required-features = ["burn-engine"]

[[bin]]
name = "classify"
path = "src/bin/classify.rs"
required-features = ["rlx-engine"]

[[bin]]
name = "download_weights"
path = "src/bin/download_weights.rs"
required-features = ["hf-download"]

[[example]]
name = "embed_rlx"
path = "examples/embed_rlx.rs"
required-features = ["rlx-engine"]

[[example]]
name = "backend_compare"
path = "examples/backend_compare.rs"
required-features = ["rlx-engine"]

[[example]]
name = "embed"
path = "examples/embed.rs"
required-features = ["burn-engine"]

[[example]]
name = "batch"
path = "examples/batch.rs"
required-features = ["burn-engine"]

[[example]]
name = "classify"
path = "examples/classify.rs"
required-features = ["burn-engine"]

[[example]]
name = "csv_export"
path = "examples/csv_export.rs"
required-features = ["burn-engine"]

[[example]]
name = "profile"
path = "examples/profile.rs"
required-features = ["burn-engine"]

# ── Tests ──────────────────────────────────────────────────────────────────
[[test]]
name = "classification"
path = "tests/classification.rs"
required-features = ["burn-engine"]

[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "csv_export"
path = "tests/csv_export.rs"
required-features = ["rlx-engine"]

[[test]]
name = "data_loading"
path = "tests/data_loading.rs"
required-features = ["burn-engine"]

[[test]]
name = "masks"
path = "tests/masks.rs"
required-features = ["burn-engine"]

[[test]]
name = "model"
path = "tests/model.rs"
required-features = ["burn-engine"]

[[test]]
name = "rlx_graph_compile"
path = "tests/rlx_graph_compile.rs"
required-features = ["rlx-engine"]

[[test]]
name = "rlx_weights_load"
path = "tests/rlx_weights_load.rs"
required-features = ["rlx-engine"]

[[test]]
name = "rlx_device_errors"
path = "tests/rlx_device_errors.rs"
required-features = ["rlx-engine"]

[[test]]
name = "parity_rlx_vs_burn"
path = "tests/parity_rlx_vs_burn.rs"
required-features = ["burn-engine", "rlx-engine"]

[[test]]
name = "parity_rlx_predictor_vs_burn"
path = "tests/parity_rlx_predictor_vs_burn.rs"
required-features = ["burn-engine", "rlx-engine"]

[[bin]]
name = "predict"
path = "src/bin/predict.rs"
required-features = ["rlx-engine"]

[[test]]
name = "parity_rlx_cross_backend"
path = "tests/parity_rlx_cross_backend.rs"
required-features = ["rlx-engine"]

[[test]]
name = "rlx_classification"
path = "tests/rlx_classification.rs"
required-features = ["rlx-engine"]

[[test]]
name = "masks_indices"
path = "tests/masks_indices.rs"

[[test]]
name = "standardize_parity"
path = "tests/standardize_parity.rs"
required-features = ["burn-engine"]

[[test]]
name = "rlx_predictor_compile"
path = "tests/rlx_predictor_compile.rs"
required-features = ["rlx-engine"]

[features]
# Default: RLX only. Burn is opt-in for parity / benchmarks (`burn-engine`).
default = ["rlx-engine"]

# ── Inference engines ───────────────────────────────────────────────────────
rlx  = ["dep:rlx"]
burn = ["dep:burn"]

rlx-engine  = ["rlx", "rlx-cpu"]
# Reference Burn stack — not in default builds; use for `infer-burn` + parity tests.
burn-engine = ["burn", "ndarray"]
# Alias for CI / docs
burn-benchmark = ["burn-engine"]

# ── Burn backends (each requires `burn`; CPU needs `ndarray` too) ──────────
# CPU backend — Rayon multi-threading + SIMD enabled by default
ndarray         = ["burn", "dep:burn-ndarray", "burn/ndarray"]
# macOS: swap matmul impl to Apple Accelerate (multi-threaded, very fast on Apple Silicon)
# Recommended: cargo build --release --features accelerate
accelerate      = ["blas-accelerate"]
blas-accelerate = ["burn", "ndarray", "burn-ndarray?/blas-accelerate"]
# Linux: use system OpenBLAS (apt install libopenblas-dev)
openblas-system = ["burn", "ndarray", "burn-ndarray?/blas-openblas-system"]
# GPU backend — wgpu on Metal (macOS) or Vulkan (Linux with GPU)
wgpu            = ["burn", "burn/wgpu"]
# GPU backend with f16 (half-precision) — 2x less memory, faster on supported GPUs.
# Requires Metal (macOS) or Vulkan (Linux). Not compatible with ndarray (CPU).
# Usage: cargo build --release --no-default-features --features wgpu-f16
wgpu-f16        = ["burn", "burn/wgpu"]

# ── RLX backends (forwarded to the rlx crate; same pattern as zuna-rs) ───
rlx-cpu             = ["rlx", "rlx/cpu"]
rlx-blas-accelerate = ["rlx", "rlx/blas-accelerate"]
rlx-blas-mkl        = ["rlx", "rlx/blas-mkl"]
rlx-blas-openblas   = ["rlx", "rlx/blas-openblas"]
rlx-metal           = ["rlx", "rlx/metal"]
rlx-mlx             = ["rlx", "rlx/mlx"]
rlx-gpu             = ["rlx", "rlx/gpu"]
rlx-cuda            = ["rlx", "rlx/cuda"]
rlx-rocm            = ["rlx", "rlx/rocm"]
rlx-tpu             = ["rlx", "rlx/tpu"]
rlx-apple-silicon   = ["rlx", "rlx/apple-silicon"]
rlx-nvidia          = ["rlx", "rlx/nvidia"]

# Shorthand aliases (RLX)
cpu             = ["rlx-cpu"]
mlx             = ["rlx-mlx"]
metal           = ["rlx-metal"]
gpu             = ["rlx-gpu"]
cuda            = ["rlx-cuda"]
rocm            = ["rlx-rocm"]
tpu             = ["rlx-tpu"]
apple-silicon   = ["rlx-apple-silicon"]
nvidia          = ["rlx-nvidia"]

# HuggingFace Hub downloader — requires TLS
hf-download     = ["dep:hf-hub"]

[dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "simd"], optional = true }
burn-ndarray = { version = "0.20.1", default-features = false, features = ["std", "simd", "multi-threads"], optional = true }

rlx = { path = "../rlx/rlx", default-features = false, optional = true }

safetensors = "0.7"
half = { version = "2", features = ["bytemuck"] }
rayon = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
fastrand = "2"
thiserror = "2"
ndarray = "0.16"

# HuggingFace Hub client — optional; only compiled with --features hf-download.
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
cubek-matmul = { git = "https://github.com/eugenehp/cubek.git", branch = "cubek-matmul", package = "cubek-matmul" }
